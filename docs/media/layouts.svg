<circle cx="44" cy="28" r="6.5" fill="#ff5f57"/><circle cx="64" cy="28" r="6.5" fill="#febc2e"/><circle cx="84" cy="28" r="6.5" fill="#28c840"/>
<text x="852" y="32" font-family="Menlo,monospace" font-size="12" fill="#6a6a78" text-anchor="end">hs space</text>
<text x="30" y="82" font-family="Menlo,monospace" font-size="13" fill="#e0e0ea" font-weight="bold"><tspan fill="#7aa2f7" font-weight="bold">❯</tspan> hs space save work</text>
<text x="30" y="102" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  saved layout &#x27;work&#x27; at ~/.config/herdr/herdr-suite/layouts/work.json</text>
<text x="30" y="122" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  workspace &#x27;demo&#x27; · 3 tabs · 5 panes</text>
<text x="30" y="142" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  tab 1 &#x27;api&#x27; · 3 panes · focus pane 2</text>
<text x="30" y="162" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  pane 1 · claude working · ~/Projects/demo/api</text>
<text x="30" y="192" font-family="Menlo,monospace" font-size="13" fill="#e0e0ea" font-weight="bold"><tspan fill="#7aa2f7" font-weight="bold">❯</tspan> hs space show work</text>
<text x="30" y="212" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  layout &#x27;work&#x27; · global · schema_version 1</text>
<text x="30" y="232" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  workspace &#x27;demo&#x27; · 3 tabs · 5 panes</text>
<text x="30" y="252" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  tab 1 &#x27;api&#x27; · 3 panes · focus pane 2</text>
<text x="30" y="272" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  pane 1 · claude working · ~/Projects/demo/api</text>
<text x="30" y="302" font-family="Menlo,monospace" font-size="13" fill="#e0e0ea" font-weight="bold"><tspan fill="#7aa2f7" font-weight="bold">❯</tspan> hs space load work --new-workspace --dry-run</text>
<text x="30" y="322" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  plan for layout &#x27;work&#x27; · 3 tabs · 5 panes</text>
<text x="30" y="342" font-family="Menlo,monospace" font-size="13" fill="#9ece6a">  1. create workspace &#x27;demo&#x27; · cwd ~/Projects/demo</text>
<text x="30" y="362" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  2. rename tab 1 &#x27;api&#x27;</text>
<text x="30" y="382" font-family="Menlo,monospace" font-size="13" fill="#9ece6a">  3. start agent claude in pane 1</text>
<text x="30" y="402" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  4. split right 0.60 → new pane 2 · cwd ~/Projects/demo/api</text>
<text x="30" y="422" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  …</text>
<text x="30" y="442" font-family="Menlo,monospace" font-size="13" fill="#c8c8d4">  9. focus workspace · 10. focus tab · 11. focus agent</text>
<text x="30" y="472" font-family="Menlo,monospace" font-size="13" fill="#7d7d8a">save = capture · show = inspect · load --dry-run = plan without touching herdr</text>
</svg>