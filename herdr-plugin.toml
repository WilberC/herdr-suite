id = "herdr-suite"
name = "Herdr Suite"
version = "0.2.3"
# `herdr api snapshot` first shipped in herdr 0.7.2 (src/cli/api.rs gained the
# snapshot subcommand with the session.snapshot socket method). Plugin actions
# and panes arrived in 0.7.0, so 0.7.5 covers everything this plugin uses.
min_herdr_version = "0.7.5"
description = "Session and space management for herdr: switch named sessions, then snapshot and restore workspace layouts"
platforms = ["linux", "macos"]

build = [
  { command = ["bash", "bin/ensure-binary.sh", "--in-tree"] }
]

# Focus history for the two toggles: one ephemeral process per focus event writes
# the id to a per-session state file and exits. There is no daemon, and nothing
# is bound to a key until the user adds the two keybindings in docs/last.md.
events = [
  { on = "workspace.focused", command = ["bin/hs", "last", "observe"] },
  { on = "tab.focused", command = ["bin/hs", "last", "observe"] },
]

# GS session restore is default off. The startup hook reads the plugin config
# (gs_restore.install is the master gate, gs_restore.auto_install chooses install
# or a one-line hint) and does nothing until the user opts in. The reporter
# itself installs into the gentle-shell agent directory named by
# PI_CODING_AGENT_DIR, so a vanilla pi installation is untouched.
[[startup]]
command = ["bin/hs", "gs-restore", "startup"]

# The [[build]] hook provisions bin/hs on every install and update: it builds
# with a local Go toolchain and falls back to the prebuilt hs-<os>-<arch>
# release binary verified against the tag (the herdr-agent-usage pattern).
# `herdr plugin link` runs no build, so a working tree uses "make hs".
[[actions]]
id = "gs-install"
title = "Install GS session restore"
description = "Install the gentle-shell session reporter into the gentle-shell agent directory (default off)"
contexts = ["global"]
command = ["bin/hs", "gs-restore", "install"]

[[actions]]
id = "hs-path"
title = "Install hs on PATH"
description = "Write an update-safe shim into ~/.local/bin so hs works from your shell; then run hs path status"
contexts = ["global"]
command = ["bin/hs", "path", "install"]

[[actions]]
id = "last-workspace"
title = "Toggle to the previous workspace"
description = "Focus the workspace this session was on before the current one, and swap back"
contexts = ["global"]
command = ["bin/hs", "last", "workspace"]

[[actions]]
id = "last-tab"
title = "Toggle to the previous tab"
description = "Focus the tab this workspace was on before the current one, and swap back"
contexts = ["global"]
command = ["bin/hs", "last", "tab"]

[[actions]]
id = "save"
title = "Save space"
description = "Snapshot the current workspace as a layout named after it"
contexts = ["workspace", "pane"]
command = ["bin/hs", "space", "save", "--current"]

[[actions]]
id = "load"
title = "Load space"
description = "Pick a stored layout and rebuild it in a new workspace"
contexts = ["global"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin herdr-suite --entrypoint load --placement popup --focus"]

[[actions]]
id = "list"
title = "List layouts"
description = "Show the layouts visible from here in a pane"
contexts = ["global"]
command = ["bash", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin herdr-suite --entrypoint layouts --placement popup --focus"]

# Both popups are sized in cells to the frame the TUIs draw in, so neither shows
# a band of unused pane around a centred frame. The space prompts clamp their own
# size to 60..120 wide and 16..24 tall, and herdr spawns the pane's command in the
# popup's inner area -- the border takes one cell a side and one more column is
# reserved (src/popup_size.rs) -- so 120x24 hands the command 117x22, which is a
# size the prompts draw at whole. herdr clamps a cell size to the terminal it
# opens in, so a smaller terminal shrinks the popup instead of overflowing it.
# The layouts table shares the same canvas.
[[panes]]
id = "load"
title = "Load space"
description = "Pick a stored layout and rebuild it in a new workspace"
placement = "popup"
width = 120
height = 24
command = ["bin/hs", "space", "load", "--select"]

[[panes]]
id = "layouts"
title = "Layouts"
description = "The layouts visible from here, their scope and what they hold"
placement = "popup"
width = 120
height = 24
command = ["bin/hs", "space", "list", "--pane"]
